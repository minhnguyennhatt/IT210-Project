<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đăng ký')}"></head>
<body>
<div class="auth-container">
    <div class="auth-card" style="max-width:560px;">
        <h1><i class="fas fa-user-plus"></i> Đăng ký tài khoản</h1>
        <p class="subtitle">Tạo tài khoản sinh viên mới để sử dụng hệ thống</p>

        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
            <!-- Hidden field: only STUDENT role allowed on public registration -->
            <input type="hidden" th:field="*{role}" value="STUDENT"/>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Tên đăng nhập *</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="vd: nguyenvana" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="vd: email@uni.edu.vn" required>
                </div>
            </div>
            <div class="form-group">
                <label for="fullName">Họ và tên *</label>
                <input type="text" id="fullName" th:field="*{fullName}" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Mật khẩu *</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu" required>
                </div>
            </div>

            <div class="form-group" style="background: #f0f4ff; padding: 12px 16px; border-radius: 8px; border: 1px solid #d0d8f0;">
                <i class="fas fa-info-circle" style="color: #4a6cf7;"></i>
                <span style="color: #4a6cf7; font-size: 14px;"> Tài khoản đăng ký mặc định là <strong>Sinh viên</strong>. Tài khoản Giảng viên do Quản trị viên tạo.</span>
            </div>

            <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Đăng ký</button>
        </form>
        <p class="auth-link">Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a></p>
    </div>
</div>
</body>
</html>
