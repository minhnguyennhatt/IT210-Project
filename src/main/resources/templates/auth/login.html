<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đăng nhập')}"></head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h1><i class="fas fa-graduation-cap"></i> Smart Academic</h1>
        <p class="subtitle">Nền tảng Hỗ trợ Học thuật &amp; Quản lý Thiết bị</p>

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Nhập tên đăng nhập" required>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
        </form>

        <p class="auth-link">Chưa có tài khoản? <a th:href="@{/auth/register}">Đăng ký ngay</a></p>
    </div>
</div>
</body>
</html>
