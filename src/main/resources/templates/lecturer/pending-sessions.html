<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main-layout :: layout('Chờ đánh giá', ~{::content})}">
<div th:fragment="content">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-slate-100 flex items-center gap-3">
            <i class="fas fa-clipboard-list text-indigo-400"></i> Sinh viên chờ đánh giá
        </h1>
    </div>

    <div class="glass-card overflow-hidden">
        <div class="table-container" th:if="${sessions != null && !sessions.isEmpty()}">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th class="w-16">ID</th>
                        <th>Ngày</th>
                        <th>Giờ</th>
                        <th>Sinh viên</th>
                        <th>Ghi chú</th>
                        <th class="text-right">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${sessions}">
                        <td th:text="${'#' + s.id}" class="text-indigo-300 font-mono text-xs"></td>
                        <td th:text="${s.sessionDate}" class="font-medium text-slate-200"></td>
                        <td th:text="${s.startTime + ' - ' + s.endTime}"></td>
                        <td th:text="${s.studentName}" class="font-medium text-indigo-300"></td>
                        <td th:text="${s.note}" class="max-w-xs truncate text-slate-400"></td>
                        <td class="text-right">
                            <a th:href="@{/lecturer/evaluate/{id}(id=${s.id})}" class="inline-flex items-center gap-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                <i class="fas fa-edit"></i> Đánh giá
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="py-16 text-center text-slate-400" th:if="${sessions == null || sessions.isEmpty()}">
            <i class="fas fa-inbox text-5xl opacity-30 mb-4"></i>
            <p class="text-lg">Không có sinh viên nào đang chờ đánh giá</p>
        </div>
    </div>
</div>
</html>
