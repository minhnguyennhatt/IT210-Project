<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main-layout :: layout('Đánh giá sinh viên', ~{::content})}">
<div th:fragment="content">
    <div class="page-header"><h1><i class="fas fa-edit"></i> Đánh giá &amp; Chỉ định thiết bị</h1></div>
    <div class="card">
        <div style="margin-bottom:1.5rem;padding:1rem;background:rgba(99,102,241,0.1);border-radius:10px;">
            <p><strong>Sinh viên:</strong> <span th:text="${session.student.fullName}"></span></p>
            <p><strong>Ngày:</strong> <span th:text="${session.sessionDate}"></span> | <strong>Giờ:</strong> <span th:text="${session.startTime + ' - ' + session.endTime}"></span></p>
            <p th:if="${session.note}"><strong>Ghi chú:</strong> <span th:text="${session.note}"></span></p>
        </div>

        <form th:action="@{/lecturer/evaluate}" method="post">
            <input type="hidden" name="mentoringSessionId" th:value="${session.id}">

            <div class="form-group">
                <label for="performanceLevel">Đánh giá năng lực *</label>
                <select id="performanceLevel" name="performanceLevel" required>
                    <option value="">-- Chọn --</option>
                    <option value="Xuất sắc">Xuất sắc</option>
                    <option value="Giỏi">Giỏi</option>
                    <option value="Khá">Khá</option>
                    <option value="Trung bình">Trung bình</option>
                    <option value="Yếu">Yếu</option>
                </select>
            </div>
            <div class="form-group">
                <label for="evaluationComment">Nhận xét</label>
                <textarea id="evaluationComment" name="evaluationComment" rows="3" placeholder="Nhận xét về buổi tư vấn..."></textarea>
            </div>
            <div class="form-group">
                <label for="recommendation">Khuyến nghị</label>
                <textarea id="recommendation" name="recommendation" rows="2" placeholder="Hướng phát triển, tài liệu tham khảo..."></textarea>
            </div>

            <div class="card-header"><h2><i class="fas fa-tools"></i> Chỉ định thiết bị/tài liệu mượn</h2></div>
            <div id="equipment-list">
                <div class="form-row equipment-row" th:each="eq, iter : ${equipments}">
                    <div class="form-group" style="flex:3;">
                        <label th:text="${eq.name + ' (Tồn kho: ' + eq.quantityInStock + ')'}"></label>
                        <input type="hidden" th:name="${'equipmentItems[' + iter.index + '].equipmentId'}" th:value="${eq.id}">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Số lượng</label>
                        <input type="number" th:name="${'equipmentItems[' + iter.index + '].quantity'}" value="0" min="0" th:max="${eq.quantityInStock}">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="expectedReturnDate">Ngày trả dự kiến</label>
                <input type="date" id="expectedReturnDate" name="expectedReturnDate">
            </div>

            <button type="submit" class="btn btn-success"><i class="fas fa-check"></i> Hoàn tất đánh giá</button>
            <a th:href="@{/lecturer/pending-sessions}" class="btn btn-warning" style="margin-left:0.5rem;">Quay lại</a>
        </form>
    </div>
</div>
</html>
