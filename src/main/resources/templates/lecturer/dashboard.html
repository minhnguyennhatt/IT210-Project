<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main-layout :: layout('Tổng quan - Giảng viên', ~{::content})}">
<div th:fragment="content">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-slate-100">Xin chào, <span th:text="${user.fullName}" class="text-indigo-400">Giảng viên</span>!</h1>
        <p class="text-slate-400 text-sm mt-1">Bảng điều khiển giảng viên</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass-card flex items-center p-6 gap-5">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-2xl shrink-0 border border-amber-500/20">
                <i class="fas fa-clipboard-list"></i>
            </div>
            <div>
                <div class="text-3xl font-bold text-slate-100" th:text="${pendingSessions != null ? pendingSessions.size() : 0}">0</div>
                <div class="text-slate-400 text-sm font-medium">Đang chờ đánh giá</div>
            </div>
        </div>
    </div>

    <div class="glass-card overflow-hidden">
        <div class="flex items-center justify-between p-6 border-b border-indigo-500/10">
            <h2 class="text-lg font-semibold text-slate-100 flex items-center gap-2">
                <i class="fas fa-clock text-indigo-400"></i> Sinh viên đang chờ tư vấn
            </h2>
            <a th:href="@{/lecturer/pending-sessions}" class="text-sm font-medium text-indigo-400 hover:text-indigo-300 bg-indigo-500/10 hover:bg-indigo-500/20 px-4 py-2 rounded-lg transition-colors">Xem tất cả</a>
        </div>
        
        <div class="table-container" th:if="${pendingSessions != null && !pendingSessions.isEmpty()}">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>Ngày</th>
                        <th>Giờ</th>
                        <th>Sinh viên</th>
                        <th>Ghi chú</th>
                        <th class="text-right">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s, i : ${pendingSessions}" th:if="${i.index < 5}">
                        <td th:text="${s.sessionDate}" class="font-medium text-slate-200"></td>
                        <td th:text="${s.startTime + ' - ' + s.endTime}"></td>
                        <td th:text="${s.studentName}" class="font-medium text-indigo-300"></td>
                        <td th:text="${s.note}" class="max-w-xs truncate text-slate-400"></td>
                        <td class="text-right">
                            <a th:href="@{/lecturer/evaluate/{id}(id=${s.id})}" class="inline-flex items-center gap-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
                                <i class="fas fa-edit"></i> Đánh giá
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="py-16 text-center text-slate-400" th:if="${pendingSessions == null || pendingSessions.isEmpty()}">
            <i class="fas fa-inbox text-5xl opacity-30 mb-4"></i>
            <p class="text-lg">Không có sinh viên nào đang chờ</p>
        </div>
    </div>
</div>
</html>
