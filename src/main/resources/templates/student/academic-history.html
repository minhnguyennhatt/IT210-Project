<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main-layout :: layout('Lịch sử học thuật', ~{::content})}">
<div th:fragment="content">
    <div class="page-header"><h1><i class="fas fa-history"></i> Lịch sử Học thuật</h1></div>

    <div th:if="${history != null && !history.isEmpty()}">
        <div class="card" th:each="h : ${history}">
            <div class="card-header">
                <h2><i class="fas fa-chalkboard-teacher"></i> Buổi tư vấn ngày <span th:text="${h.sessionDate}"></span></h2>
            </div>
            <div class="form-row" style="margin-bottom:1rem;">
                <div class="form-group"><label>Giảng viên</label><p th:text="${h.lecturerName}" style="color:#818cf8;font-weight:600;"></p></div>
                <div class="form-group"><label>Khoa</label><p th:text="${h.departmentName}"></p></div>
                <div class="form-group"><label>Đánh giá năng lực</label>
                    <span class="badge badge-completed" th:text="${h.performanceLevel}"></span>
                </div>
            </div>
            <div th:if="${h.evaluationComment}" style="margin-bottom:1rem;">
                <label style="color:#94a3b8;font-size:0.85rem;">Nhận xét</label>
                <p th:text="${h.evaluationComment}" style="padding:0.5rem 0;"></p>
            </div>
            <div th:if="${h.recommendation}" style="margin-bottom:1rem;">
                <label style="color:#94a3b8;font-size:0.85rem;">Khuyến nghị</label>
                <p th:text="${h.recommendation}" style="padding:0.5rem 0;"></p>
            </div>
            <div th:if="${h.borrowedEquipments != null && !h.borrowedEquipments.isEmpty()}">
                <label style="color:#94a3b8;font-size:0.85rem;">Thiết bị đã mượn</label>
                <table style="margin-top:0.5rem;"><thead><tr><th>Mã TB</th><th>Tên thiết bị</th><th>Số lượng</th></tr></thead>
                    <tbody><tr th:each="borrowedItem : ${h.borrowedEquipments}">
                        <td th:text="${borrowedItem.equipmentCode}"></td><td th:text="${borrowedItem.equipmentName}"></td><td th:text="${borrowedItem.quantity}"></td>
                    </tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="card empty-state" th:if="${history == null || history.isEmpty()}">
        <i class="fas fa-book-open"></i><p>Chưa có lịch sử học thuật</p>
    </div>
</div>
</html>
