<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main-layout :: layout('Quản lý người dùng', ~{::content})}">
<div th:fragment="content">
    <div class="page-header">
        <div><h1><i class="fas fa-users-cog"></i> Quản lý người dùng</h1></div>
        <div style="display:flex; gap:8px;">
            <a th:href="@{/admin/users/new(role='STUDENT')}" class="btn btn-primary"><i class="fas fa-user-plus"></i> Thêm Sinh viên</a>
            <a th:href="@{/admin/users/new(role='LECTURER')}" class="btn btn-success"><i class="fas fa-chalkboard-teacher"></i> Thêm Giảng viên</a>
        </div>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <!-- Filter tabs -->
    <div class="card" style="margin-bottom: 20px;">
        <div style="display:flex; gap:12px; padding: 12px 16px;">
            <a th:href="@{/admin/users}" class="btn btn-sm" th:classappend="${selectedRole == null || selectedRole == ''} ? 'btn-primary' : 'btn-secondary'">Tất cả</a>
            <a th:href="@{/admin/users(role='STUDENT')}" class="btn btn-sm" th:classappend="${selectedRole == 'STUDENT'} ? 'btn-primary' : 'btn-secondary'"><i class="fas fa-user-graduate"></i> Sinh viên</a>
            <a th:href="@{/admin/users(role='LECTURER')}" class="btn btn-sm" th:classappend="${selectedRole == 'LECTURER'} ? 'btn-primary' : 'btn-secondary'"><i class="fas fa-chalkboard-teacher"></i> Giảng viên</a>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Danh sách người dùng</h2>
            <span class="badge badge-info" th:text="${#lists.size(users)} + ' người dùng'">0 người dùng</span>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Tên đăng nhập</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Vai trò</th>
                        <th>Thông tin thêm</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td><strong th:text="${u.username}"></strong></td>
                        <td th:text="${u.fullName}"></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span th:if="${u.role.name() == 'STUDENT'}" class="badge badge-info"><i class="fas fa-user-graduate"></i> Sinh viên</span>
                            <span th:if="${u.role.name() == 'LECTURER'}" class="badge badge-success"><i class="fas fa-chalkboard-teacher"></i> Giảng viên</span>
                        </td>
                        <td>
                            <!-- Lecturer details -->
                            <span th:if="${u.role.name() == 'LECTURER'}">
                                <span th:each="l : ${lecturerDetails}" th:if="${l.user.id == u.id}">
                                    <span th:text="${l.department.name}"></span>
                                    <br><small th:if="${l.academicRank}" th:text="${l.academicRank}"></small>
                                </span>
                            </span>
                            <span th:if="${u.role.name() == 'STUDENT'}">
                                <small th:text="${u.phone}"></small>
                            </span>
                        </td>
                        <td>
                            <span th:if="${u.isActive}" class="badge badge-success">Hoạt động</span>
                            <span th:if="${!u.isActive}" class="badge badge-danger">Vô hiệu hóa</span>
                        </td>
                        <td>
                            <div style="display:flex; gap:6px;">
                                <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-primary" title="Sửa"><i class="fas fa-edit"></i></a>
                                <form th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm" th:classappend="${u.isActive} ? 'btn-warning' : 'btn-success'" th:title="${u.isActive} ? 'Vô hiệu hóa' : 'Kích hoạt'">
                                        <i th:classappend="${u.isActive} ? 'fas fa-ban' : 'fas fa-check'"></i>
                                    </button>
                                </form>
                                <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" style="display:inline;"
                                      onsubmit="return confirm('Bạn có chắc muốn xóa tài khoản này?')">
                                    <button type="submit" class="btn btn-sm btn-danger" title="Xóa"><i class="fas fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" style="text-align:center; padding: 40px; color: #888;">
                            <i class="fas fa-inbox" style="font-size: 32px;"></i><br>
                            Không có người dùng nào.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</html>
