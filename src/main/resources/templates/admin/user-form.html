<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main-layout :: layout(~{::title}, ~{::content})}">
<title th:text="${isEdit} ? 'Chỉnh sửa người dùng' : 'Thêm người dùng'">Thêm người dùng</title>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1>
                <i th:classappend="${isEdit} ? 'fas fa-edit' : 'fas fa-user-plus'"></i>
                <span th:text="${isEdit} ? 'Chỉnh sửa người dùng' : 'Thêm người dùng'"></span>
            </h1>
        </div>
        <a th:href="@{/admin/users}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <div class="card" style="max-width: 700px;">
        <form th:action="${isEdit} ? '/admin/users/' + ${user.id} : '/admin/users'" method="post" style="padding: 24px;">
            <!-- Role selection (only for create) -->
            <div class="form-group" th:if="${!isEdit}">
                <label for="role">Vai trò *</label>
                <select id="role" name="role" onchange="toggleLecturerFields()">
                    <option value="STUDENT" th:selected="${selectedRole == 'STUDENT' || selectedRole == null}">Sinh viên</option>
                    <option value="LECTURER" th:selected="${selectedRole == 'LECTURER'}">Giảng viên</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Tên đăng nhập *</label>
                    <input type="text" id="username" name="username" th:value="${user.username}" placeholder="vd: nguyenvana"
                           th:readonly="${isEdit}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" th:value="${user.email}" placeholder="vd: email@uni.edu.vn" required>
                </div>
            </div>

            <div class="form-group">
                <label for="fullName">Họ và tên *</label>
                <input type="text" id="fullName" name="fullName" th:value="${user.fullName}" placeholder="Nguyễn Văn A" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password" th:text="${isEdit} ? 'Mật khẩu mới (để trống nếu không đổi)' : 'Mật khẩu *'">Mật khẩu</label>
                    <input type="password" id="password" name="password" th:attr="placeholder=${isEdit} ? 'Để trống nếu không đổi' : 'Tối thiểu 6 ký tự'"
                           th:required="${!isEdit}">
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="text" id="phone" name="phone" th:value="${user.phone}" placeholder="vd: 0901234567">
                </div>
            </div>

            <!-- Status (only for edit) -->
            <div class="form-group" th:if="${isEdit}">
                <label for="isActive">Trạng thái</label>
                <select id="isActive" name="isActive">
                    <option value="true" th:selected="${user.isActive}">Hoạt động</option>
                    <option value="false" th:selected="${!user.isActive}">Vô hiệu hóa</option>
                </select>
            </div>

            <!-- Lecturer-specific fields -->
            <div id="lecturerFields" th:style="${selectedRole != 'LECTURER' && (lecturerDetail == null)} ? 'display:none' : ''">
                <hr style="margin: 16px 0;">
                <h3 style="font-size: 16px; margin-bottom: 12px; color: #4a6cf7;"><i class="fas fa-chalkboard-teacher"></i> Thông tin Giảng viên</h3>
                <div class="form-group">
                    <label for="departmentId">Khoa/Ngành *</label>
                    <select id="departmentId" name="departmentId">
                        <option value="">-- Chọn Khoa --</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"
                                th:selected="${lecturerDetail != null && lecturerDetail.department.id == dept.id}"></option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="academicRank">Học hàm/Học vị</label>
                        <input type="text" id="academicRank" name="academicRank"
                               th:value="${lecturerDetail != null ? lecturerDetail.academicRank : ''}" placeholder="vd: Tiến sĩ">
                    </div>
                    <div class="form-group">
                        <label for="specialization">Chuyên ngành</label>
                        <input type="text" id="specialization" name="specialization"
                               th:value="${lecturerDetail != null ? lecturerDetail.specialization : ''}" placeholder="vd: AI, Machine Learning">
                    </div>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-primary">
                    <i th:classappend="${isEdit} ? 'fas fa-save' : 'fas fa-plus'"></i>
                    <span th:text="${isEdit} ? 'Cập nhật' : 'Tạo tài khoản'"></span>
                </button>
                <a th:href="@{/admin/users}" class="btn btn-secondary" style="margin-left: 8px;">Hủy</a>
            </div>
        </form>
    </div>
</div>

<script>
function toggleLecturerFields() {
    var role = document.getElementById('role');
    var fields = document.getElementById('lecturerFields');
    if (role && fields) {
        fields.style.display = role.value === 'LECTURER' ? 'block' : 'none';
    }
}
// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    toggleLecturerFields();
});
</script>
</html>
