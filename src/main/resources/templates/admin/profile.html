<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main-layout :: layout('Hồ sơ cá nhân', ~{::content})}">
<div th:fragment="content">
    <div class="page-header"><h1><i class="fas fa-user-shield"></i> Hồ sơ cá nhân</h1></div>
    <div class="card">
        <form th:action="@{/profile}" method="post">
            <div class="form-row">
                <div class="form-group"><label>Tên đăng nhập</label><input type="text" th:value="${user.username}" disabled></div>
                <div class="form-group"><label>Email</label><input type="text" th:value="${user.email}" disabled></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label for="fullName">Họ và tên</label><input type="text" id="fullName" name="fullName" th:value="${user.fullName}"></div>
                <div class="form-group"><label for="phone">Số điện thoại</label><input type="text" id="phone" name="phone" th:value="${user.phone}"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label for="gender">Giới tính</label>
                    <select id="gender" name="gender">
                        <option value="">-- Chọn --</option>
                        <option value="MALE" th:selected="${user.gender != null && user.gender.name() == 'MALE'}">Nam</option>
                        <option value="FEMALE" th:selected="${user.gender != null && user.gender.name() == 'FEMALE'}">Nữ</option>
                        <option value="OTHER" th:selected="${user.gender != null && user.gender.name() == 'OTHER'}">Khác</option>
                    </select>
                </div>
                <div class="form-group"><label for="dob">Ngày sinh</label><input type="date" id="dob" name="dob" th:value="${user.dob}"></div>
            </div>
            <div class="form-group"><label for="address">Địa chỉ</label><textarea id="address" name="address" rows="2" th:text="${user.address}"></textarea></div>
            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Cập nhật</button>
        </form>
    </div>
</div>
</html>
